<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ego</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="EGO — sua evolução pessoal. Aplicativo local, sem conta e sem mensalidade.">


<style>
:root{--bg:#000;--card:#070707;--line:#2c2c2c;--tx:#f5f5f5;--mut:#8a8a8a;--or:#ff1a1a;--or2:#7a0000;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
body{max-width:480px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.an{font-weight:700;margin:0}h2{font-size:20px}h3{font-size:16px}
header{position:sticky;top:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.logo{font-family:'UnifrakturCook','Old English Text MT',serif;font-weight:700;font-size:34px;line-height:1.1;color:var(--or);display:flex;justify-content:center;align-items:center;position:relative}
.logo span{background:linear-gradient(90deg,#ff1a1a,#6b0000);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px}
.logo small{position:absolute;right:0;font:600 12px Arial,sans-serif;color:var(--mut)}
.bar{height:8px;background:#070707;box-shadow:inset 0 0 0 1px var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff1a1a,#6b0000);border-radius:9px;transition:width .6s}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.st{flex:none;text-align:center;font-size:11px;color:var(--mut);cursor:pointer}
.st b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--bg);border:3px solid var(--or);font-size:24px;margin-bottom:4px}
.st.ok b{border-color:#333;opacity:.6}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
button.p{width:100%;margin-top:14px;background:linear-gradient(90deg,var(--or),var(--or2));color:#fff;border:0;border-radius:10px;padding:13px;font:700 16px Arial,sans-serif;cursor:pointer}
button.g{background:#070707;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:600 13px Arial,sans-serif;cursor:pointer}
.big{font:700 34px Arial,sans-serif;color:var(--or)}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}.chk{width:22px;height:22px;border-radius:50%;border:2px solid #ff1a1a;display:grid;place-items:center;font-size:13px}
.task.ok .chk{background:#ff1a1a;border-color:#ff1a1a;color:#fff}.task.ok span{color:var(--mut);text-decoration:line-through}
.post .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--or);color:#000;display:grid;place-items:center;font:700 14px Arial,sans-serif}
.post p{margin:6px 0;color:#ddd;font-size:14px;line-height:1.45}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.item em{color:var(--or);font-style:normal;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}
.chip.on{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid img,.grid .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#070707;display:grid;place-items:center;color:#ff1a1a;font-size:26px}
.prev{width:100%;border-radius:12px;margin-top:10px;max-height:240px;object-fit:cover}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;background:rgba(7,7,7,.6);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.16);border-radius:34px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:6}
nav div{display:grid;place-items:center;flex:1;color:#ff1a1a;opacity:.65;cursor:pointer;padding:10px 0;border-radius:26px;transition:background .3s,opacity .3s,transform .2s}nav svg{width:28px;height:28px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav .on{opacity:1;background:rgba(255,255,255,.14);animation:pop .35s ease}nav div:active{transform:scale(.9)}
.mut{color:var(--mut);font-size:12px}button[onclick*="del"]{color:#ff1a1a}.ci{width:20px;height:20px;fill:#ff1a1a;vertical-align:-4px;margin-right:6px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes fin{0%{height:8px;box-shadow:0 0 0 #ff1a1a}50%{height:30px;box-shadow:0 0 30px 10px #ff1a1a}100%{height:30px;box-shadow:0 0 16px #ff1a1a88}}
#hb.full{animation:fin 1.6s ease-out both}#hb.full i{filter:brightness(1.4)}
.phrase{display:none;text-align:center;font-weight:700;font-size:14px;color:var(--or);padding:6px 0 2px;animation:up .6s ease both}
.enter>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}

button{transition:transform .15s,filter .2s}button:active{transform:scale(.96)}button.p:hover{filter:brightness(1.1)}
.task,.chk,.chip,input,select{transition:background .25s,border-color .25s,color .25s}
#rbar{transition:opacity .6s}#rbar.hide{opacity:0}
.kt{position:relative;height:0;z-index:3;pointer-events:none}
.kt svg{position:absolute;left:0;top:-27px;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 6px #ff1a1a88)}
.kt .sw{animation:swin 3.8s ease both}
@keyframes swin{0%{opacity:0;transform:translateX(-30px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.kt .dr{animation:drip 3.8s ease-in both}
@keyframes drip{0%,28%{opacity:0;transform:translate(284px,19px) scale(.3)}36%{opacity:1;transform:translate(284px,22px) scale(1)}78%{opacity:1;transform:translate(284px,66px) scale(1)}86%,100%{opacity:0;transform:translate(284px,70px) scale(.8)}}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:10px;font:700 14px Arial,sans-serif;cursor:pointer}
.seg .on{background:#070707;box-shadow:inset 0 0 0 1px var(--line);color:var(--tx)}
.xg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--rh,110px);grid-auto-flow:dense;gap:2px}
.tile{position:relative;overflow:hidden;background:#070707;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile.vp{grid-row:span 2}.tile.vl{grid-column:span 2}
.tile svg.pl{position:absolute;top:6px;right:6px;width:18px;height:18px;fill:#ff1a1a;filter:drop-shadow(0 0 3px #000)}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:grid;grid-template-columns:100%;place-items:center;overflow:hidden;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash:not(.out)~header,#splash:not(.out)~main,#splash:not(.out)~nav{visibility:hidden}
#eyec{grid-area:1/1;width:140px;height:182px;display:block;translate:0 21px;transition:opacity .5s,transform .5s;will-change:opacity,transform}
#eyec.off{opacity:0;transform:scale(1.05)}
#splash .nm{grid-area:1/1;font-family:'UnifrakturCook','Old English Text MT',serif;font-size:100px;line-height:1;white-space:nowrap;color:#ff1a1a;text-shadow:0 0 16px rgba(255,26,26,.8),0 0 42px rgba(255,26,26,.45);opacity:0;transform:scale(.94);transition:opacity .9s,transform .9s;will-change:opacity,transform}
#splash .nm.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* EGO — refinamento visual premium: preserva estrutura, conteúdo e funções */
:root{

.bar{height:7px;background:#090a0d;border:1px solid #292d35;border-radius:99px;box-shadow:inset 0 2px 5px rgba(0,0,0,.55);margin-top:11px}

function blobToDataURL(blob){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(blob)})}

function importBackup(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(f.size>500*1024*1024){alert('O backup ultrapassa 500 MB.');input.value='';return;}
  var r=new FileReader();r.onerror=function(){alert('Não foi possível ler o arquivo.');input.value=''};
  r.onload=async function(){
    var old=null;

      var d=JSON.parse(r.result);
      if(!d||d.app!=='EGO'||![1,2].includes(d.version)||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw 0;
      if(!Array.isArray(d.state.routine)||!Array.isArray(d.state.log)||!Array.isArray(d.state.plan))throw 0;
      if(d.photos!=null&&!Array.isArray(d.photos))throw 0;if(d.vent!=null&&!Array.isArray(d.vent))throw 0;
      if(d.avatar!=null&&typeof d.avatar!=='string')throw 0;if(d.hero!=null&&!safeDataURL(d.hero,'image'))throw 0;
      var progress=[],videos=[];
      if(d.version===2){if(!d.media||!Array.isArray(d.media.progress)||!Array.isArray(d.media.videos)||d.media.progress.length>10000||d.media.videos.length>1000)throw 0;progress=d.media.progress.map(function(x){if(!x||!Number.isFinite(+x.id)||!Number.isFinite(+x.ts)||!safeDataURL(x.data,'image'))throw 0;return {id:+x.id,ts:+x.ts,data:x.data}});videos=d.media.videos.map(function(v){if(!v||!Number.isFinite(+v.id)||typeof v.blob!=='string'||v.blob.length>140*1024*1024||!/^data:video\/[a-z0-9.+-]+;base64,/i.test(v.blob))throw 0;return {id:+v.id,ts:+v.ts||Date.now(),o:v.o==='p'||v.o==='l'?v.o:'',blob:dataURLToBlob(v.blob)}});}
      var next=Object.assign({},D,d.state),photos=Array.isArray(d.photos)?d.photos.filter(function(x){return safeDataURL(x,'image')}):[],vent=Array.isArray(d.vent)?d.vent.filter(function(m){return m&&typeof m==='object'&&Number.isFinite(+m.ts)&&((typeof m.x==='string'&&m.x.length<=4000)||safeDataURL(m.a,'audio'))}).map(function(m){return {ts:+m.ts,x:typeof m.x==='string'?m.x.slice(0,4000):'',a:safeDataURL(m.a,'audio')?m.a:null}}):[],avatar=safeDataURL(d.avatar,'image')?d.avatar:null,hero=safeDataURL(d.hero,'image')?d.hero:null;
      if(!confirm('Importar este backup vai substituir os dados atuais deste navegador, inclusive as mídias salvas. Continuar?'))return;
      var keys=[KEY,'mc_vis','mc_av','mc_vent','mc_hero'],vals=[JSON.stringify(next),JSON.stringify(photos),avatar,JSON.stringify(vent),hero];old=keys.map(function(k){return localStorage.getItem(k)});
      keys.forEach(function(k,i){if(vals[i]===null)localStorage.removeItem(k);else localStorage.setItem(k,vals[i])});
      if(d.version===2){var ok=await new Promise(function(resolve){idbReplaceMedia(progress,videos,resolve)});if(!ok)throw new Error('Falha ao restaurar mídias')}
      alert('Backup importado com sucesso. O EGO será reiniciado com os dados restaurados.');location.reload();
    }catch(e){if(old){[KEY,'mc_vis','mc_av','mc_vent','mc_hero'].forEach(function(k,i){try{if(old[i]===null)localStorage.removeItem(k);else localStorage.setItem(k,old[i])}catch(ignore){}})}alert('Arquivo inválido, incompatível ou sem espaço para restaurar. Os dados locais anteriores foram preservados.');}
    finally{input.value=''}
  };r.readAsText(f);
}
